<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Slider</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #362a2b;
    }

    .slider {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .slide.current {
      opacity: 1;
    }

    .slide:nth-child(1) {
      background: url("1.png") no-repeat center center / cover;
    }

    .slide:nth-child(2) {
      background: url("2.png") no-repeat center center / cover;
    }

    .slide:nth-child(3) {
      background: url("3.png") no-repeat center center / cover;
    }

    .slide:nth-child(4) {
      background: url("4.png") no-repeat center center / cover;
    }

    .slide:nth-child(5) {
      background: url("5.png") no-repeat center center / cover;
    }

    .slide:nth-child(6) {
      background: url("6.png") no-repeat center center / cover;
    }

    .buttons button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 48px;
      height: 48px;

      border: 2px solid #e5ebf3;
      border-radius: 50%;

      background-color: rgba(0, 0, 0, 0.2);
      color: #e5ebf3;

      cursor: pointer;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 16px;
    }

    #prev {
      left: 16px;
    }

    #next {
      right: 16px;
    }

    .buttons button:hover {
      background-color: #e5ebf3;
      color: #362a2b;
    }
  </style>
</head>

<body>

  <div class="slider">

    <div class="slide current"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>

    <div class="buttons">

      <button id="prev" aria-label="Previous slide">
        <i class="fas fa-arrow-left"></i>
      </button>

      <button id="next" aria-label="Next slide">
        <i class="fas fa-arrow-right"></i>
      </button>

    </div>

  </div>

  <script>
    const slides = document.querySelectorAll(".slide");
    const nextButton = document.getElementById("next");
    const prevButton = document.getElementById("prev");

    let currentSlide = 0;

    function showSlide(index) {
      slides.forEach((slide) => {
        slide.classList.remove("current");
      });

      slides[index].classList.add("current");
    }

    nextButton.addEventListener("click", function () {
      currentSlide++;

      if (currentSlide >= slides.length) {
        currentSlide = 0;
      }

      showSlide(currentSlide);
    });

    prevButton.addEventListener("click", function () {
      currentSlide--;

      if (currentSlide < 0) {
        currentSlide = slides.length - 1;
      }

      showSlide(currentSlide);
    });
  </script>

</body>

</html>
